# Render Blueprint for a SECOND independent BNKR node (Node B).
# Create a new Blueprint from this file in Render; do not reconfigure the
# existing banneker-coin service with it. Render injects PORT automatically.

services:
  - type: web
    name: banneker-coin-node-b
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: bnkr-node-b-data
      mountPath: /var/lib/bnkr
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/lib/bnkr/node-b.db
      # Exact external HTTPS origin for this service. For a different operator,
      # replace this with the service's real Render URL.
      - key: PUBLIC_URL
        value: https://banneker-coin-node-b.onrender.com
      # All peers except this node. Registration creates reverse edges and
      # discovery also learns transitive peers from the seeds.
      - key: SEED_PEERS
        value: https://banneker-coin.onrender.com,https://the-black-coin.onrender.com
      # Never enable private peers in production.
      - key: ALLOW_LOCAL_PEERS
        value: "false"
      - key: NODE_ENV
        value: production
